[custom]
;重要！每个组名的空格后面都添加了一个隐藏字符 \u200d 用于防止与节点重名，改名需谨慎

exclude_remarks=(Data Left|Remain:|Traffic:|Expir[ey]|Reset|(\d[\d.]*\s*[MG]B[^\dA-Za-z]+|[:：]\s*)\d[\d.]*\s*GB(?![\dA-Za-z])|剩[余餘]流量|流量：|[到过過效]期|[时時][间間]|重置|分割线|残り使用容量|残りデータ通信量|有效期限|リセット|🔰 (ID|HSD|SNI):|📝 Gói:)

; --- 基础设置 ---
add_emoji=true
remove_old_emoji=false

; --- 核心总控分组 (注意：节点引用名必须与下方定义严格一致) ---
custom_proxy_group=🚀‍节点选择`select`[]♻️‍自动选择`[]🇭🇰‍香港节点`[]🇹🇼‍台湾节点`[]🇸🇬‍狮城节点`[]🇯🇵‍日本节点`[]🇺🇲‍美国节点`[]🇰🇷‍韩国节点`[]📶‍官方优选`[]☑️‍手动切换`[]DIRECT

custom_proxy_group=☑️‍手动切换`select`.*

; 自动测速组：覆盖主要区域
custom_proxy_group=♻️‍自动选择`url-test`[]🇭🇰‍香港节点`[]🇸🇬‍狮城节点`[]🇯🇵‍日本节点`[]🇰🇷‍韩国节点`http://www.gstatic.com/generate_204`300,,50

; 运营商负载均衡：识别 filter.py 备注中的 CM/CU/CT/CF
custom_proxy_group=📶‍官方优选`load-balance`(官方|防|电信|联通|移动|CT|CU|CM|CF|t.me|WARP|Warp|warp)`http://www.gstatic.com/generate_204`300,,50

