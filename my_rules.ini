; 2. 自动测速 (全区域最优)
custom_proxy_group=♻️ 自动选择`url-test`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`http://www.gstatic.com/generate_204`300,,50

; 3. 运营商直达 (精准识别 CMCC/CUCC/CTCC)
