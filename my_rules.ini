; --- 2. 设置分组标志位 (核心修复部分) ---

; 【主控组】
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇺🇲 美国负载`[]🇭🇰 香港负载`[]🇹🇼 台湾负载`[]🇯🇵 日本负载`[]🇸🇬 狮城负载`[]🇰🇷 韩国负载`[]🇪🇺 欧洲负载`[]📶 运营商优选`[]☑️ 手动切换`[]DIRECT

; 【自动测速组】从各个区域负载组中挑最快的一个
custom_proxy_group=♻️ 自动选择`url-test`[]🇺🇲 美国负载`[]🇭🇰 香港负载`[]🇯🇵 日本负载`[]🇸🇬 狮城负载`[]🇹🇼 台湾负载`http://www.gstatic.com/generate_204`300,,50

; 【手动切换】展示所有原始节点
custom_proxy_group=☑️ 手动切换`select`^.*

; 【运营商负载均衡】利用备注中的 CMCC/CUCC/CTCC 标志
custom_proxy_group=📶 运营商优选`load-balance`^.*(CMCC|CUCC|CTCC|移动|联通|电信).*`http://www.gstatic.com/generate_204`300,,50

; --- 3. 区域负载均衡组 (适配 90% 以上 Colo) ---
; 逻辑：通过正则匹配 filter.py 的输出，自动归类并开启负载均衡

custom_proxy_group=🇺🇲 美国负载`load-balance`^.*(US|美国|洛杉矶|圣何塞|西雅图|芝加哥|纽约|SJC|LAX|IAD|SEA).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港负载`load-balance`^.*(HK|香港|港|HKG).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本负载`load-balance`^.*(JP|日本|东京|大阪|NRT|KIX).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾负载`load-balance`^.*(TW|台湾|台|台北|TPE).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城负载`load-balance`^.*(SG|新加坡|狮城|SIN).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国负载`load-balance`^.*(KR|韩国|韩|首尔|ICN).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇪🇺 欧洲负载`load-balance`^.*(DE|FR|GB|英国|德国|法国|伦敦|巴黎|法兰克福|LHR|CDG|FRA).*`http://www.gstatic.com/generate_204`300,,50

