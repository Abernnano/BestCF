custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🇪🇺 欧洲节点`[]🌏 东南亚组`[]🇦🇺 澳洲节点`[]🇨🇦 加拿大组`[]📶 官方优选`[]☑️ 手动切换`[]DIRECT

; [管理组] 手动与自动
custom_proxy_group=☑️ 手动切换`select`.*
