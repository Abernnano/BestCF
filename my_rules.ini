[custom]
;重要！每个组名的空格后面都添加了一个隐藏字符 \u200d

exclude_remarks=(Data Left|Remain:|Traffic:|Expir[ey]|Reset|重置|流量|有效期)

; --- 基础设置 ---
add_emoji=true
remove_old_emoji=false

; --- 核心总控分组 ---
custom_proxy_group=🚀‍节点选择`select`[]♻️‍自动选择`[]🇺🇲‍美国节点`[]🇭🇰‍香港节点`[]🇹🇼‍台湾节点`[]🇸🇬‍狮城节点`[]🇯🇵‍日本节点`[]🇰🇷‍韩国节点`[]🇪🇺‍欧洲节点`[]🌏‍东南亚组`[]🇦🇺‍澳洲节点`[]📶‍官方优选`[]☑️‍手动切换`[]DIRECT

custom_proxy_group=☑️‍手动切换`select`.*

custom_proxy_group=♻️‍自动选择`url-test`[]🇺🇲‍美国节点`[]🇭🇰‍香港节点`[]🇯🇵‍日本节点`[]🇸🇬‍狮城节点`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=📶‍官方优选`load-balance`(移动|联通|电信|CMCC|CUCC|CTCC|CF|WARP)`http://www.gstatic.com/generate_204`300,,50

; --- 严格前缀匹配负载均衡组 (解决西雅图匹配到奥地利的问题) ---

custom_proxy_group=🇭🇰‍香港节点`load-balance`^((HK|香港|HongKong)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇯🇵‍日本节点`load-balance`^((JP|日本|Japan|Tokyo|NRT|KIX)_).*$`http://www.gstatic.com/generate_204`300,,50

; 美国组：增加对西雅图的显式捕获
custom_proxy_group=🇺🇲‍美国节点`load-balance`^((US|美国|America|洛杉矶|圣何塞|西雅图|芝加哥|纽约|LAX|SFO|SJC|SEA)_).*$`http://www.gstatic.com/generate_204`300,,150

custom_proxy_group=🇹🇼‍台湾节点`load-balance`^((TW|台湾|Taiwan|台北|TPE)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇸🇬‍狮城节点`load-balance`^((SG|新加坡|Singapore|狮城|SIN)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇰🇷‍韩国节点`load-balance`^((KR|韩国|Korea|首尔|ICN)_).*$`http://www.gstatic.com/generate_204`300,,50

; 欧洲组修复：使用 ^((国家码)_|中文名_) 确保不误杀
custom_proxy_group=🇪🇺‍欧洲节点`load-balance`^((DE|FR|GB|UK|NL|IT|ES|CH|PL|CZ|SE|NO|DK|FI|IE|AT|德国|法国|英国|荷兰|意大利|西班牙|奥地利|FRA|CDG|LHR|AMS)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🌏‍东南亚组`load-balance`^((VN|TH|PH|MY|ID|越南|泰国|菲律宾|马来西亚|印尼|SGN|BKK|MNL|KUL|JKT)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇦🇺‍澳洲节点`load-balance`^((AU|NZ|澳洲|悉尼|墨尔本|SYD|MEL|BNE|AKL)_).*$`http://www.gstatic.com/generate_204`300,,50

; --- 应用分流组 (集成所有新区域) ---
custom_proxy_group=📹‍油管视频`select`[]🚀‍节点选择`[]🇺🇲‍美国节点`[]🇭🇰‍香港节点`[]🇯🇵‍日本节点`[]🇪🇺‍欧洲节点
custom_proxy_group=🎥‍奈飞视频`select`[]🇺🇲‍美国节点`[]🇭🇰‍香港节点`[]🇹🇼‍台湾节点`[]🇸🇬‍狮城节点`[]🇪🇺‍欧洲节点`[]🚀‍节点选择
custom_proxy_group=🤖‍OpenAi`select`[]🇺🇲‍美国节点`[]🇸🇬‍狮城节点`[]🇯🇵‍日本节点`[]🇪🇺‍欧洲节点`[]🇦🇺‍澳洲节点
custom_proxy_group=📲‍电报消息`select`[]🇸🇬‍狮城节点`[]🇭🇰‍香港节点`[]🇺🇲‍美国节点`[]🇪🇺‍欧洲节点`[]🌏‍东南亚组
custom_proxy_group=📢‍谷歌FCM`select`[]DIRECT`[]🚀‍节点选择`[]🇺🇲‍美国节点
custom_proxy_group=🌏‍国内媒体`select`[]DIRECT`[]🇭🇰‍香港节点`[]🇹🇼‍台湾节点`[]☑️‍手动切换
custom_proxy_group=🌍‍国外媒体`select`[]🚀‍节点选择`[]♻️‍自动选择`[]🇺🇲‍美国节点`[]🇭🇰‍香港节点`[]🇪🇺‍欧洲节点`[]🌏‍东南亚组
custom_proxy_group=📺‍巴哈姆特`select`[]🇹🇼‍台湾节点`[]DIRECT
custom_proxy_group=🎶‍网易音乐`select`[]DIRECT`[]🚀‍节点选择
custom_proxy_group=🎮‍游戏平台`select`[]DIRECT`[]🇯🇵‍日本节点`[]🇺🇲‍美国节点`[]🇪🇺‍欧洲节点

custom_proxy_group=🎯‍全球直连`select`[]DIRECT`[]🚀‍节点选择
custom_proxy_group=🛑‍广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟‍漏网之鱼`select`[]🚀‍节点选择`[]DIRECT

; --- 规则集 ---
enable_rule_generator=true
overwrite_original_rules=true
ruleset=🎯‍全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🛑‍广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🤖‍OpenAi,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=📹‍油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎥‍奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=📲‍电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀‍节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🎯‍全球直连,[]GEOIP,CN
ruleset=🐟‍漏网之鱼,[]FINAL
