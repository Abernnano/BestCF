[custom]
; --- 基础全局设置 ---
; 开启 Emoji 识别并保留原始名称以便正则匹配
add_emoji=true
remove_old_emoji=false
exclude_remarks=(Data Left|Remain:|Traffic:|Expir[ey]|Reset|重置|流量|有效期)

; --- 覆盖 90% 以上 Colo 的国家/地区识别 (Emoji 映射) ---
emoji=^(?i).*(美[国國]|USA?|洛杉|圣何塞|旧金山|西雅图|芝加哥|纽约|阿什本|凤凰城|波特兰|达拉斯|拉斯维加斯|丹佛|迈阿密|加州|弗吉尼亚),🇺🇸
emoji=^(?i).*(香港|HKG?|Hong),🇭🇰
emoji=^(?i).*(台[湾灣]|TWN?|台北|新北|台中|彰化|高雄),🇹🇼
emoji=^(?i).*(日本|JPN?|东京|大阪|名古屋|福冈|埼玉),🇯🇵
emoji=^(?i).*(新加[坡坡]|SGP?|狮城),🇸🇬
emoji=^(?i).*(韩[国國]|KOR?|首尔|春川),🇰🇷
emoji=^(?i).*(英[国國]|GBR?|伦敦|曼彻斯特),🇬🇧
emoji=^(?i).*(德[国國]|DEU?|法兰克福|柏林|杜塞尔多夫),🇩🇪
emoji=^(?i).*(法[国國]|FRA?|巴黎|马赛),🇫🇷
emoji=^(?i).*(加拿大|CAN?|温哥华|多伦多|蒙特利尔),🇨🇦
emoji=^(?i).*(澳大利[亚亞]|AUS?|悉尼|墨尔本|布里斯班),🇦🇺
emoji=^(?i).*(印度|IND?|孟买|新德里|金奈),🇮🇳
emoji=^(?i).*(越南|VNM?|胡志明|河内),🇻🇳
emoji=^(?i).*(泰国|THA?|曼谷),🇹🇭
emoji=^(?i).*(印尼|IDN?|雅加达),🇮🇩
emoji=^(?i).*(荷兰|NLD?|阿姆斯特丹),🇳🇱
emoji=^(?i).*(俄[罗羅]斯|RUS?|莫斯科|圣彼得堡),🇷🇺

; --- 核心负载均衡与自动优选组 ---

; 1. 默认出口组
custom_proxy_group=✈️ 起飞`select`[]⚡ 自动优选`[]⚖️ 全局负载`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]📶 移动专选`[]DIRECT

; 2. 测速与负载逻辑
custom_proxy_group=⚡ 自动优选`url-test`^.*`https://www.google.com/generate_204`300,,50
custom_proxy_group=⚖️ 全局负载`load-balance`^.*`https://www.google.com/generate_204`300,,50

; 3. 区域级负载均衡池 (实现 90% 覆盖的关键)
custom_proxy_group=🇺🇸 美国节点`load-balance`^.*(美国|US|洛杉|圣何塞|旧金山|西雅图|芝加哥|纽约|阿什本).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港节点`load-balance`^.*(香港|HK|Hong).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`load-balance`^.*(台湾|TW|台北|彰化).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`load-balance`^.*(日本|JP|东京|大阪|名古屋).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`load-balance`^.*(新加坡|SG|SGP|狮城).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`load-balance`^.*(韩国|KR|首尔).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🇪🇺 欧洲节点`load-balance`^.*(德|法|英|荷|伦敦|巴黎|法兰克福|DE|FR|GB|NL).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=🌏 亚太节点`load-balance`^.*(印尼|越南|泰国|印度|悉尼|AU|ID|VN|TH|IN).*`https://www.google.com/generate_204`300,,50

; 4. 运营商匹配组 (filter.py 备注识别)
custom_proxy_group=📶 移动专选`url-test`^.*(CMCC).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=📶 联通专选`url-test`^.*(CUCC).*`https://www.google.com/generate_204`300,,50
custom_proxy_group=📶 电信专选`url-test`^.*(CTCC).*`https://www.google.com/generate_204`300,,50

; --- 应用级分流逻辑 ---
custom_proxy_group=📹 油管视频`select`[]✈️ 起飞`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点
custom_proxy_group=🎥 奈飞视频`select`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 狮城节点`[]✈️ 起飞
custom_proxy_group=📺 巴哈姆特`select`[]🇹🇼 台湾节点`[]DIRECT
custom_proxy_group=📲 电报消息`select`[]✈️ 起飞`[]🇸🇬 狮城节点`[]🇺🇸 美国节点
custom_proxy_group=📢 谷歌FCM`select`[]✈️ 起飞`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`[]✈️ 起飞`[]🇺🇸 美国节点
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]✈️ 起飞`[]🇺🇸 美国节点
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]✈️ 起飞`[]🇺🇸 美国节点
custom_proxy_group=🎶 网易音乐`select`[]DIRECT`[]🛰️ 解锁音乐
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]✈️ 起飞`[]🇯🇵 日本节点`[]🇺🇸 美国节点
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`[]🇭🇰 香港节点`[]🇹🇼 台湾节点
custom_proxy_group=🌍 国外媒体`select`[]✈️ 起飞`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点
custom_proxy_group=💩 广告`select`[]REJECT`[]DIRECT

; --- 规则集匹配 (基于官方与 cmliu 维护版本) ---
enable_rule_generator=true
overwrite_original_rules=true

; 基础与广告
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=💩 广告,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; 视频与流媒体
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎥 奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=📺 巴哈姆特,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bahamut.list

; 通讯与应用
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=Ⓜ️ 微软云盘,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OneDrive.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎶 网易音乐,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/NetEaseMusic.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list

; 媒体兜底
ruleset=🌏 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; 兜底全局
ruleset=✈️ 起飞,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=DIRECT,[]GEOIP,CN
ruleset=✈️ 起飞,[]FINAL
