[custom]
; --- 基础全局设置 ---
add_emoji=true
remove_old_emoji=false
exclude_remarks=(Data Left|Remain:|Traffic:|Expir[ey]|Reset|重置|流量|有效期)

; --- 核心总控分组 ---
; 确保节点选择组包含所有细分区域
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🇪🇺 欧洲节点`[]🌏 东南亚组`[]🇦🇺 澳洲节点`[]🌍 中东非洲`[]🌎 拉美节点`[]📶 官方优选`[]☑️ 手动切换`[]DIRECT

custom_proxy_group=☑️ 手动切换`select`.*

; 自动测速组：挑选延迟最低的区域
custom_proxy_group=♻️ 自动选择`url-test`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇹🇼 台湾节点`http://www.gstatic.com/generate_204`300,,50

; 运营商组：识别备注尾部的运营商标识
custom_proxy_group=📶 官方优选`load-balance`(移动|联通|电信|CMCC|CUCC|CTCC|CF|WARP|Warp|warp)`http://www.gstatic.com/generate_204`300,,50

; --- 强化地域负载均衡组 (修复 US/欧洲 碰撞问题) ---
; 修复逻辑：使用 ^(国家码|中文名)_ 确保只匹配前缀，防止匹配到城市名中间的字母

custom_proxy_group=🇭🇰 香港节点`load-balance`^((HK|香港|HongKong)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇯🇵 日本节点`load-balance`^((JP|日本|Japan|Tokyo|NRT|HND|KIX|NGO)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇺🇲 美国节点`load-balance`^((US|美国|America|洛杉矶|圣何塞|西雅图|芝加哥|纽约|LAX|SFO|SJC|SEA|IAD|ORD|DFW)_).*$`http://www.gstatic.com/generate_204`300,,150

custom_proxy_group=🇹🇼 台湾节点`load-balance`^((TW|台湾|Taiwan|台北|新北|彰化|TPE|KHH)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇸🇬 狮城节点`load-balance`^((SG|新加坡|Singapore|狮城|SIN)_).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇰🇷 韩国节点`load-balance`^((KR|韩国|Korea|首尔|ICN)_).*$`http://www.gstatic.com/generate_204`300,,50

; 欧洲节点：涵盖德、法、英、荷、意、西、瑞等
custom_proxy_group=🇪🇺 欧洲节点`load-balance`^((DE|FR|GB|UK|NL|IT|ES|CH|PL|CZ|SE|NO|DK|FI|IE|AT|德国|法国|英国|荷兰|意大利|西班牙|瑞士|波兰|FRA|CDG|LHR|AMS|MRS)_).*$`http://www.gstatic.com/generate_204`300,,50

; 东南亚组：涵盖越、泰、菲、马、印尼
custom_proxy_group=🌏 东南亚组`load-balance`^((VN|TH|PH|MY|ID|越南|泰国|菲律宾|马来西亚|印尼|SGN|HAN|BKK|MNL|KUL|JKT)_).*$`http://www.gstatic.com/generate_204`300,,50

; 澳洲节点
custom_proxy_group=🇦🇺 澳洲节点`load-balance`^((AU|NZ|澳洲|悉尼|墨尔本|SYD|MEL|BNE|AKL)_).*$`http://www.gstatic.com/generate_204`300,,50

; 中东非洲：涵盖阿联酋、南非、以色列、沙特
custom_proxy_group=🌍 中东非洲`load-balance`^((AE|ZA|IL|SA|迪拜|南非|以色列|DXB|JNB|TLV)_).*$`http://www.gstatic.com/generate_204`300,,50

; 拉美节点：涵盖巴西、阿根廷、墨西哥、智利
custom_proxy_group=🌎 拉美节点`load-balance`^((BR|AR|MX|CL|巴西|墨西哥|阿根廷|GRU|GIG|EZE|MEX)_).*$`http://www.gstatic.com/generate_204`300,,50

; --- 应用分流分组 (已整合负载均衡组) ---

custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇸🇬 狮城节点

custom_proxy_group=Ⓜ️ 微软Bing`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点

custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇪🇺 欧洲节点

