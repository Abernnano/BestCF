name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "heartbeat.txt"

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      actions: write
    steps:
      - name: Fix Git SSL and Proxy
        shell: powershell
        run: |
          git config --global http.sslBackend schannel
          # 针对你的 7897 端口设置全局拉取代理（如有必要）
          # git config --global http.proxy http://127.0.0.1:7897
          Write-Host "Git environment initialized."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Prepare Directories
        shell: powershell
        run: |
          if (!(Test-Path "./tmp")) { New-Item -ItemType Directory -Path "./tmp" -Force }
          if (!(Test-Path "./bestcf")) { New-Item -ItemType Directory -Path "./bestcf" -Force }
          echo "update_version=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV

      - name: Generate bestcf `Domain`
        shell: powershell
        run: |
          $domains = New-Object System.Collections.Generic.List[string]
          try {
              $resp1 = Invoke-RestMethod -Uri "https://cf.090227.xyz" -UserAgent "Mozilla/5.0"
              if ($resp1 -match "copyDomain\('(.+?)'\)") { $domains.Add($matches[1]) }
          } catch { Write-Warning "Source 1 failed" }
          # ... 其他域名源逻辑 ...
          $domains | Select-Object -Unique | Where-Object { $_ -match "cloudflare|cf" } | Out-File -FilePath "./bestcf/bestcf-domain.txt" -Encoding utf8

      - name: Generate bestcf `IP`
        shell: powershell
        run: |
          function Get-IPList($url, $label) {
              try {
                  $data = Invoke-RestMethod -Uri $url -TimeoutSec 30 -UserAgent "Mozilla/5.0"
                  $lines = $data -split "`n" | Where-Object { $_ -and $_ -notmatch "^#" }
                  $count = 1
                  return $lines | ForEach-Object { "$($_.Trim())#$($label)_$($count)"; $count++ }
              } catch { return @() }
          }

          # CMCC IP (v4 & v6)
          $cmcc = Get-IPList "https://cf.090227.xyz/cmcc?ips=50" "CMCC-IPv4"
          $cmcc += Get-IPList "https://cf.090227.xyz/cmcc-ipv6?ips=50" "CMCC-IPv6"
          $cmcc | Out-File -FilePath "./bestcf/cmcc-ip.txt" -Encoding utf8

          # CUCC IP (v4 & v6)
          $cucc = Get-IPList "https://cf.090227.xyz/cu?ips=50" "CUCC-IPv4"
          $cucc += Get-IPList "https://cf.090227.xyz/cu-ipv6?ips=50" "CUCC-IPv6" # 补全接口
          $cucc | Out-File -FilePath "./bestcf/cucc-ip.txt" -Encoding utf8

          # CTCC IP (v4 & v6)
          $ctcc = Get-IPList "https://cf.090227.xyz/ct?ips=50" "CTCC-IPv4"
          $ctcc += Get-IPList "https://cf.090227.xyz/ct-ipv6?ips=50" "CTCC-IPv6" # 补全接口
          $ctcc | Out-File -FilePath "./bestcf/ctcc-ip.txt" -Encoding utf8

          # 全球混合优选
          $best = Get-IPList "https://ipdb.api.030101.xyz/?type=bestcfv4" "CF-v4"
          $best += Get-IPList "https://ipdb.api.030101.xyz/?type=bestcfv6" "CF-v6"
          $best | Out-File -FilePath "./bestcf/bestcf-ip.txt" -Encoding utf8

      - name: Auto-Country Classification
        env:
          PYTHONIOENCODING: utf-8
          # 核心：分类时必须禁用代理
          http_proxy: ""
          https_proxy: ""
          no_proxy: "*"
        shell: powershell
        run: |
          if (Test-Path "filter.py") {
              & D:\Anaconda3\python.exe filter.py
          } else {
              Write-Error "filter.py not found!"
              exit 1
          }

      - name: Git push to bestcf branch
        shell: powershell
        run: |
          cd ./bestcf
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 设置推送专用代理
          git config --local http.proxy "http://127.0.0.1:7897" 
          git config --local https.proxy "http://127.0.0.1:7897"
          git config --local http.sslBackend schannel
          git config --local http.sslVerify "false"
          git checkout -b bestcf
          git add .
          git commit -m "优选更新于 $($env:update_version)"
          git push -f "https://$($env:GITHUB_ACTOR):$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" bestcf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: update-${{ env.update_version }}
          name: 优选更新 - ${{ env.update_version }}
          files: ./bestcf/*.txt
          body: "Cloudflare 优选 IP 自动更新。时间: ${{ env.update_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive (Heartbeat)
        shell: powershell
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 心跳同步也需要代理
          git config --local http.proxy "http://127.0.0.1:7897"
          git pull origin main --rebase
          Get-Date | Out-File -FilePath "heartbeat.txt" -Encoding utf8
          git add heartbeat.txt
          git commit -m "Chore: Keepalive heartbeat $(Get-Date)"
          git push origin main

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
