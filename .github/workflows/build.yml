name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "heartbeat.txt"

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Directories
        shell: bash
        run: |
          mkdir -p ./tmp/ ./bestcf/
          echo "update_version=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Generate bestcf `Domain`
        shell: bash
        run: |
          # 抓取各类域名称
          curl -sSL https://cf.090227.xyz | grep 'copyDomain' | awk -F "'" '{print $2}' > ./tmp/temp-bestcf-domain.txt
          curl -sSL https://cf.090227.xyz | sed -n '/<pre>/,/<\/pre>/p' | sed 's/<pre>//; s/<\/pre>//; s/^[ \t]*//; s/#.*//' >> ./tmp/temp-bestcf-domain.txt
          curl -sSL https://vps789.com/openApi/cfIpTop20 | jq -r '.data.good[].ip' | grep -Ev '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' >> ./tmp/temp-bestcf-domain.txt
          curl -sSL https://www.wetest.vip/page/cloudflare/cname.html | awk '/4&amp;6/{print prev} {prev=$0}' | awk -F '[<>]' '{print $3}' | sed 's/\*/bestcf/' >> ./tmp/temp-bestcf-domain.txt
          
          # 过滤并去重
          cat ./tmp/temp-bestcf-domain.txt | grep -Ei 'cloudflare|cf' | sort -u > ./bestcf/bestcf-domain.txt
          rm -f ./tmp/temp-bestcf-domain.txt

      - name: Generate bestcf `IP`
        shell: bash
        run: |
          # --- CMCC-IP ---
          curl -sSL https://cf.090227.xyz/cmcc?ips=5 | sed 's/#.*//' | awk 'NF {print $0 "#CMCC-IPv4_CMLiu_" NR}' > ./bestcf/cmcc-ip.txt
          curl -sSL https://cf.090227.xyz/cmcc-ipv6 | sed 's/#.*//' | awk 'NF {print $0 "#CMCC-IPv6_CMLiu_" NR}' >> ./bestcf/cmcc-ip.txt
          curl -sSL https://vps789.com/openApi/cfIpApi | jq -r '.data.CM[].ip' | awk 'NF {print $0 "#CMCC-IPv4_VPS789_" NR}' >> ./bestcf/cmcc-ip.txt
          curl -sSL https://api.hostmonit.com/get_optimization_ip --data-raw '{"key":"iDetkOys"}' | jq -r '.info[] | select(.line == "CM") | .ip' | awk 'NF {print $0 "#CMCC-IPv4_CFYes_" NR}' >> ./bestcf/cmcc-ip.txt
          curl -sSL https://api.hostmonit.com/get_optimization_ip --data-raw '{"key":"iDetkOys","type":"v6"}' | jq -r '.info[] | select(.line == "CM") | .ip' | awk 'NF {print "["$0"]#CMCC-IPv6_CFYes_" NR}' >> ./bestcf/cmcc-ip.txt
          curl -sSL https://www.wetest.vip/page/cloudflare/address_v4.html | awk '/移动/{getline; print}' | awk -F '[<>]' '{print $3}' | awk 'NF {print $0 "#CMCC-IPv4_WeTest_" NR}' >> ./bestcf/cmcc-ip.txt
          curl -sSL https://www.wetest.vip/page/cloudflare/address_v6.html | awk '/移动/{getline; print}' | awk -F '[<>]' '{print $3}' | awk 'NF {print "["$0"]#CMCC-IPv6_WeTest_" NR}' >> ./bestcf/cmcc-ip.txt

          # --- CUCC-IP ---
          curl -sSL https://cf.090227.xyz/cu?ips=5 | sed 's/#.*//' | awk 'NF {print $0 "#CUCC-IPv4_CMLiu_" NR}' > ./bestcf/cucc-ip.txt
          curl -sSL https://vps789.com/openApi/cfIpApi | jq -r '.data.CU[].ip' | awk 'NF {print $0 "#CUCC-IPv4_VPS789_" NR}' >> ./bestcf/cucc-ip.txt
          curl -sSL https://api.hostmonit.com/get_optimization_ip --data-raw '{"key":"iDetkOys"}' | jq -r '.info[] | select(.line == "CU") | .ip' | awk 'NF {print $0 "#CUCC-IPv4_CFYes_" NR}' >> ./bestcf/cucc-ip.txt
          curl -sSL https://api.hostmonit.com/get_optimization_ip --data-raw '{"key":"iDetkOys","type":"v6"}' | jq -r '.info[] | select(.line == "CU") | .ip' | awk 'NF {print "["$0"]#CUCC-IPv6_CFYes_" NR}' >> ./bestcf/cucc-ip.txt
          curl -sSL https://www.wetest.vip/page/cloudflare/address_v4.html | awk '/联通/{getline; print}' | awk -F '[<>]' '{print $3}' | awk 'NF {print $0 "#CUCC-IPv4_WeTest_" NR}' >> ./bestcf/cucc-ip.txt
          curl -sSL https://www.wetest.vip/page/cloudflare/address_v6.html | awk '/联通/{getline; print}' | awk -F '[<>]' '{print $3}' | awk 'NF {print "["$0"]#CUCC-IPv6_WeTest_" NR}' >> ./bestcf/cucc-ip.txt

          # --- CTCC-IP ---
          curl -sSL https://cf.090227.xyz/ct?ips=5 | sed 's/#.*//' | awk 'NF {print $0 "#CTCC-IPv4_CMLiu_" NR}' > ./bestcf/ctcc-ip.txt
          curl -sSL https://vps789.com/openApi/cfIpApi | jq -r '.data.CT[].ip' | awk 'NF {print $0 "#CTCC-IPv4_VPS789_" NR}' >> ./bestcf/ctcc-ip.txt
          curl -sSL https://api.hostmonit.com/get_optimization_ip --data-raw '{"key":"iDetkOys"}' | jq -r '.info[] | select(.line == "CT") | .ip' | awk 'NF {print $0 "#CTCC-IPv4_CFYes_" NR}' >> ./bestcf/ctcc-ip.txt
          curl -sSL https://api.hostmonit.com/get_optimization_ip --data-raw '{"key":"iDetkOys","type":"v6"}' | jq -r '.info[] | select(.line == "CT") | .ip' | awk 'NF {print "["$0"]#CTCC-IPv6_CFYes_" NR}' >> ./bestcf/ctcc-ip.txt
          curl -sSL https://www.wetest.vip/page/cloudflare/address_v4.html | awk '/电信/{getline; print}' | awk -F '[<>]' '{print $3}' | awk 'NF {print $0 "#CTCC-IPv4_WeTest_" NR}' >> ./bestcf/ctcc-ip.txt
          curl -sSL https://www.wetest.vip/page/cloudflare/address_v6.html | awk '/电信/{getline; print}' | awk -F '[<>]' '{print $3}' | awk 'NF {print "["$0"]#CTCC-IPv6_WeTest_" NR}' >> ./bestcf/ctcc-ip.txt

          # --- CF-IP (Global Best) ---
          curl -sSL https://vps789.com/openApi/cfIpApi | jq -r '.data.AllAvg[].ip' | awk 'NF {print $0 "#CF-IPv4_VPS789_" NR}' > ./bestcf/bestcf-ip.txt
          curl -sSL https://ip.164746.xyz/ipTop10.html | tr ',' '\n' | head -n 5 | awk 'NF {print $0 "#CF-IPv4_CFSpeedTest_" NR}' >> ./bestcf/bestcf-ip.txt
          curl -sSL https://ipdb.api.030101.xyz/?type=bestcfv4 | head -n 5 | awk 'NF {print $0 "#CF-IPv4_IPDB_" NR}' >> ./bestcf/bestcf-ip.txt
          curl -sSL https://ipdb.api.030101.xyz/?type=bestcfv6 | head -n 5 | awk 'NF {print "["$0"]#CF-IPv6_IPDB_" NR}' >> ./bestcf/bestcf-ip.txt

          # --- Proxy-IP ---
          curl -sSL https://ipdb.api.030101.xyz/?type=bestproxy | head -n 5 | awk 'NF {print $0 "#Proxy-IPv4_IPDB_" NR}' > ./bestcf/proxy-ip.txt

      - name: Auto-Country Classification
        env:
          PYTHONIOENCODING: utf-8
          http_proxy: ""
          https_proxy: ""
        shell: powershell
        run: |
          if (Test-Path "filter.py") {
              & D:\Anaconda3\python.exe filter.py
          }

      - name: Git push to bestcf branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./bestcf
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 如果自托管机器需要代理才能访问 GitHub
          git config --local http.proxy "http://127.0.0.1:7897"
          git config --local http.sslBackend schannel
          git checkout -b bestcf
          git add .
          git commit -m "优选更新于 ${{ env.update_version }}"
          git push -f "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" bestcf

      - name: Create & Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: update-${{ env.update_version }}
          name: 优选更新 - ${{ env.update_version }}
          files: ./bestcf/*.txt
          body: "Cloudflare 优选 IP 自动更新。时间: ${{ env.update_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive (Heartbeat)
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.proxy "http://127.0.0.1:7897"
          git pull origin main --rebase
          date > heartbeat.txt
          git add heartbeat.txt
          git commit -m "Chore: Keepalive heartbeat $(date)"
          git push origin main

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
