name: Global Optimized BestCF
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [ main ]
    paths-ignore: [ "**/README.md", "heartbeat.txt" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Professional Tools
        run: |
          # maxminddb 库解析速度极快，符合你对高效数据结构的要求
          pip install maxminddb requests

      - name: Download MaxMind Database
        run: |
          # 下载高度可靠的 GeoLite2 城市数据库镜像
          curl -sSL https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb -o GeoLite2-City.mmdb

      - name: Advanced Identification
        run: python filter.py
        env:
          PYTHONIOENCODING: utf-8
          
      - name: Download IP2Location DB
        run: |
          # 下载免费版全球 IP 归属地数据库 (BIN 格式，比 DAT 格式识别率更高)
          curl -sSL https://raw.githubusercontent.com/ip2location/ip2location-lite-bin-builds/main/IP2LOCATION-LITE-DB1.BIN.ZIP -o db.zip
          unzip db.zip
          mv IP2LOCATION-LITE-DB1.BIN ip2location.bin

      - name: Fetch Raw Data
        run: |
          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./bestcf/ ./tmp/
          # 抓取逻辑 (保持你原有的 curl 内容)
          curl -sSL "https://cf.090227.xyz/cmcc?ips=20" | sed 's/#.*//' | awk '{print $0 "#CMCC-v4_" NR}' > ./bestcf/cmcc-ip.txt
          curl -sSL "https://cf.090227.xyz/cu?ips=20" | sed 's/#.*//' | awk '{print $0 "#CUCC-v4_" NR}' > ./bestcf/cucc-ip.txt
          curl -sSL "https://cf.090227.xyz/ct?ips=20" | sed 's/#.*//' | awk '{print $0 "#CTCC-v4_" NR}' > ./bestcf/ctcc-ip.txt
          curl -sSL "https://ipdb.api.030101.xyz/?type=bestproxy" | head -n 5 | awk '{print $0 "#Proxy-v4_" NR}' > ./bestcf/proxy-ip.txt

      - name: Advanced Identification
        run: python filter.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and Push
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "actions@github.com"
          git checkout -b bestcf
          git add .
          git commit -m "IP2Location识别更新 ${{ env.update_version }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin bestcf
