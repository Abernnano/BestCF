name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Debug: List Files
        shell: bash
        run: ls -R  # 查看当前目录及其子目录下的所有文件

      - name: Setup Python Environment
        run: pip install requests urllib3

      - name: Execute Core Logic
        env:
          PYTHONIOENCODING: utf-8
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          # 1. 打印当前所在路径（排查用）
          echo "Current Path: $(pwd)"
          
          # 2. 列出当前目录所有文件（排查用）
          ls -F
          
          # 3. 尝试多种路径运行，确保万无一失
          if [ -f "main.py" ]; then
            python main.py
          elif [ -f "BestCF/main.py" ]; then
            python BestCF/main.py
          else
            echo "错误：在仓库中找不到 main.py！请确认文件已上传到 GitHub。"
            exit 1
          fi

      - name: Git push to bestcf branch
        shell: bash
        run: |
          if [ -d "./bestcf" ]; then
            cd ./bestcf/
            git init
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b bestcf
            git add .
            git commit -m "优选更新于 $(date +%Y-%m-%d)"
            git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
            git push -f origin bestcf
          fi
