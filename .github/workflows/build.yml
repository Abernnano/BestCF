name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "heartbeat.txt"

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Environment
        shell: powershell
        run: |
          # 彻底解决 PowerShell 输出流编码问题
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          
          if (!(Test-Path "./tmp")) { New-Item -ItemType Directory -Path "./tmp" -Force }
          if (!(Test-Path "./bestcf")) { New-Item -ItemType Directory -Path "./bestcf" -Force }
          echo "update_version=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV

      - name: Generate bestcf `Domain`
        shell: powershell
        run: |
          $domains = New-Object System.Collections.Generic.List[string]
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

          # Source 1 & 2: cf.090227.xyz
          try {
              $html = Invoke-RestMethod -Uri "https://cf.090227.xyz" -UserAgent $ua
              # 匹配 copyDomain('...')
              if ($html -match "copyDomain\('(.+?)'\)") { $domains.Add($matches[1]) }
              # 匹配 <pre> 块中的内容
              if ($html -match "(?s)<pre>(.*?)</pre>") {
                  $preContent = $matches[1] -split "`n"
                  foreach ($line in $preContent) {
                      $clean = $line.Split('#')[0].Trim()
                      if ($clean) { $domains.Add($clean) }
                  }
              }
          } catch { Write-Warning "Source cf.090227.xyz failed" }

          # Source 3: vps789.com (JSON)
          try {
              $json = Invoke-RestMethod -Uri "https://vps789.com/openApi/cfIpTop20" -UserAgent $ua
              foreach ($item in $json.data.good) {
                  if ($item.ip -notmatch "^\d+\.\d+\.\d+\.\d+$") { $domains.Add($item.ip) }
              }
          } catch { Write-Warning "Source vps789.com failed" }

          # Source 4: wetest.vip
          try {
              $wetest = Invoke-WebRequest -Uri "https://www.wetest.vip/page/cloudflare/cname.html" -UserAgent $ua -UseBasicParsing
              $rows = $wetest.Content -split "<tr>"
              foreach ($row in $rows) {
                  if ($row -match "4&amp;6") {
                      if ($row -match "<td>(.*?)</td>") { $domains.Add($matches[1].Replace("*", "bestcf")) }
                  }
              }
          } catch { Write-Warning "Source wetest.vip failed" }

          # 过滤并保存
          $domains | Where-Object { $_ -match "cloudflare|cf" } | Select-Object -Unique | Out-File -FilePath "./bestcf/bestcf-domain.txt" -Encoding utf8

      - name: Generate bestcf `IP`
        shell: powershell
        run: |
          function Get-IPList {
              param($url, $label, $isV6 = $false, $postData = $null)
              $list = New-Object System.Collections.Generic.List[string]
              try {
                  $resp = $null
                  if ($postData) {
                      $resp = Invoke-RestMethod -Uri $url -Method Post -Body $postData -ContentType "application/json"
                  } else {
                      $resp = Invoke-RestMethod -Uri $url
                  }
                  
                  $ips = @()
                  if ($resp -is [string]) { $ips = $resp -split "`n" }
                  elseif ($resp.data.CM) { $ips = $resp.data.CM.ip; $label = "$($label)_VPS789" }
                  elseif ($resp.data.CU) { $ips = $resp.data.CU.ip; $label = "$($label)_VPS789" }
                  elseif ($resp.data.CT) { $ips = $resp.data.CT.ip; $label = "$($label)_VPS789" }
                  elseif ($resp.data.AllAvg) { $ips = $resp.data.AllAvg.ip; $label = "$($label)_VPS789" }
                  elseif ($resp.info) { $ips = $resp.info | Where-Object { $_.line -match $label.Split('-')[0] } | Select-Object -ExpandProperty ip; $label = "$($label)_CFYes" }

                  $count = 1
                  foreach ($ip in $ips) {
                      $cleanIp = $ip.Split('#')[0].Trim()
                      if (!$cleanIp) { continue }
                      if ($isV6 -and $cleanIp -notmatch "\[") { $cleanIp = "[$cleanIp]" }
                      $list.Add("$cleanIp#$($label)_$count")
                      $count++
                      if ($count -gt 10) { break } # 限制每个源的数量
                  }
              } catch { }
              return $list
          }

          # CMCC
          $cmcc = Get-IPList "https://cf.090227.xyz/cmcc?ips=5" "CMCC-IPv4_CMLiu"
          $cmcc += Get-IPList "https://cf.090227.xyz/cmcc-ipv6" "CMCC-IPv6_CMLiu" $true
          $cmcc | Out-File -FilePath "./bestcf/cmcc-ip.txt" -Encoding utf8

          # CUCC
          $cucc = Get-IPList "https://cf.090227.xyz/cu?ips=5" "CUCC-IPv4_CMLiu"
          $cucc | Out-File -FilePath "./bestcf/cucc-ip.txt" -Encoding utf8

          # CTCC
          $ctcc = Get-IPList "https://cf.090227.xyz/ct?ips=5" "CTCC-IPv4_CMLiu"
          $ctcc | Out-File -FilePath "./bestcf/ctcc-ip.txt" -Encoding utf8

          # Global Best & Proxy
          $best = Get-IPList "https://ipdb.api.030101.xyz/?type=bestcfv4" "CF-IPv4_IPDB"
          $best += Get-IPList "https://ipdb.api.030101.xyz/?type=bestcfv6" "CF-IPv6_IPDB" $true
          $best | Out-File -FilePath "./bestcf/bestcf-ip.txt" -Encoding utf8
          
          $proxy = Get-IPList "https://ipdb.api.030101.xyz/?type=bestproxy" "Proxy-IPv4_IPDB"
          $proxy | Out-File -FilePath "./bestcf/proxy-ip.txt" -Encoding utf8

      - name: Auto-Country Classification
        env:
          PYTHONIOENCODING: utf-8
          http_proxy: ""
          https_proxy: ""
        shell: powershell
        run: |
          if (Test-Path "filter.py") {
              & D:\Anaconda3\python.exe filter.py
          }

      - name: Git push to bestcf branch
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location ./bestcf
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.proxy "http://127.0.0.1:7897"
          git config --local http.sslBackend schannel
          git checkout -b bestcf
          git add .
          git commit -m "优选更新于 $($env:update_version)"
          git push -f "https://$($env:GITHUB_ACTOR):$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" bestcf

      - name: Create & Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: update-${{ env.update_version }}
          name: 优选更新 - ${{ env.update_version }}
          files: ./bestcf/*.txt
          body: "Cloudflare 优选 IP 自动更新。时间: ${{ env.update_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive (Heartbeat)
        shell: powershell
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.proxy "http://127.0.0.1:7897"
          git pull origin main --rebase
          Get-Date | Out-File -FilePath "heartbeat.txt" -Encoding utf8
          git add heartbeat.txt
          git commit -m "Chore: Keepalive heartbeat $(Get-Date)"
          git push origin main
