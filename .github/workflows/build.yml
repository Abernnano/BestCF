name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [ main ]
    paths-ignore: [ "**/README.md", "heartbeat.txt" ]

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      actions: write
    steps:
      - name: Git & Network Optimization
        shell: bash
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git config --global protocol.version 1
          # 设置 Curl 通用环境变量，全局生效
          echo "CURL_OPTS=-sSLk -4 --tls-max 1.2 --ssl-no-revoke --connect-timeout 20 --retry 5" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate Raw Data
        shell: bash
        run: |
          echo "update_version=$(date +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./bestcf/ ./tmp/
          
          # 1. 抓取逻辑 (精简合并)
          curl $CURL_OPTS https://cf.090227.xyz | grep 'copyDomain' | awk -F "'" '{print $2}' > ./tmp/raw.txt || true
          curl $CURL_OPTS https://vps789.com/openApi/cfIpTop20 | jq -r '.data.good[].ip' | grep -Ev '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' >> ./tmp/raw.txt || true
          cat ./tmp/raw.txt | grep -E 'cloudflare|cf' | sort -f -u > ./bestcf/bestcf-domain.txt
          
          # 2. 运营商 IP 抓取 (IPv4/IPv6 并行，移除中括号由 Python 处理)
          curl $CURL_OPTS "https://cf.090227.xyz/cmcc?ips=50" | sed 's/#.*//' | awk '{print $0 "#CMCC-IPv4_" NR}' > ./bestcf/cmcc-ip.txt
          curl $CURL_OPTS "https://cf.090227.xyz/cmcc-ipv6?ips=50" | sed 's/#.*//' | awk '{print $0 "#CMCC-IPv6_" NR}' >> ./bestcf/cmcc-ip.txt
          curl $CURL_OPTS "https://cf.090227.xyz/cu?ips=50" | sed 's/#.*//' | awk '{print $0 "#CUCC-IPv4_" NR}' > ./bestcf/cucc-ip.txt
          curl $CURL_OPTS "https://cf.090227.xyz/ct?ips=50" | sed 's/#.*//' | awk '{print $0 "#CTCC-IPv4_" NR}' > ./bestcf/ctcc-ip.txt
          curl $CURL_OPTS https://vps789.com/openApi/cfIpApi | jq -r '.data.AllAvg[].ip' | awk '{print $0 "#CF-IPv4_Avg_" NR}' > ./bestcf/bestcf-ip.txt
          
          rm -rf ./tmp*

      - name: Classification
        run: pip install requests && python filter.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Push and Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --- A. 推送至 bestcf 分支 ---
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -b bestcf
          git add .
          git commit -m "Auto-update ${{ env.update_version }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin bestcf
          
          # --- B. 通过 Curl 实现 Release 逻辑 (无需安装 gh) ---
          TAG="update-${{ env.update_version }}"
          API_URL="https://api.github.com/repos/${{ github.repository }}"
          
          # 检查并创建 Release，获取 ID
          REL_INFO=$(curl $CURL_OPTS -H "Authorization: token $GITHUB_TOKEN" "$API_URL/releases/tags/$TAG")
          RELEASE_ID=$(echo "$REL_INFO" | jq -r '.id // empty')
          
          if [ -z "$RELEASE_ID" ]; then
            echo "[*] Creating Release..."
            RELEASE_ID=$(curl $CURL_OPTS -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -d "{\"tag_name\":\"$TAG\",\"title\":\"优选更新 - ${{ env.update_version }}\"}" \
              "$API_URL/releases" | jq -r '.id')
          fi
          
          # 获取现有 Asset 列表并覆盖上传
          ASSETS=$(curl $CURL_OPTS -H "Authorization: token $GITHUB_TOKEN" "$API_URL/releases/$RELEASE_ID/assets")
          for file in ./*.txt; do
            filename=$(basename "$file")
            ASSET_ID=$(echo "$ASSETS" | jq -r ".[] | select(.name==\"$filename\") | .id // empty")
            [ -n "$ASSET_ID" ] && curl $CURL_OPTS -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$API_URL/releases/assets/$ASSET_ID"
            
            echo "[*] Uploading $filename..."
            curl $CURL_OPTS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$filename"
          done

      - name: Keepalive
        shell: bash
        run: |
          cd ..
          git config --local user.name "github-actions[bot]"
          echo "$(date)" > heartbeat.txt
          git add heartbeat.txt
          git commit -m "Keepalive" && git push origin main || true

  retry_on_failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
      - name: Wait and Re-run
        run: |
          sleep 1200
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate_bestcf.yml/dispatches \
            -d '{"ref":"main"}'
