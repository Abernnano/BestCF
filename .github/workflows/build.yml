name: Generate BestCF (Mainland Perspective)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [ main ]
    paths-ignore: [ "**/README.md", "heartbeat.txt" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Raw Data
        run: |
          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./bestcf/ ./tmp/
          
          # --- 抓取域名与 IP 逻辑 (保留你要求的全量逻辑) ---
          curl -sSL https://cf.090227.xyz/cmcc?ips=10 | sed 's/#.*//' | awk '{print $0 "#CMCC_" NR}' > ./bestcf/cmcc-ip.txt
          curl -sSL https://cf.090227.xyz/cu?ips=10 | sed 's/#.*//' | awk '{print $0 "#CUCC_" NR}' > ./bestcf/cucc-ip.txt
          curl -sSL https://cf.090227.xyz/ct?ips=10 | sed 's/#.*//' | awk '{print $0 "#CTCC_" NR}' > ./bestcf/ctcc-ip.txt
          
          # 抓取通用及代理 IP
          curl -sSL https://vps789.com/openApi/cfIpApi | jq -r '.data.AllAvg[].ip' | awk '{print $0 "#CF_Avg_" NR}' > ./bestcf/bestcf-ip.txt
          curl -sSL https://ipdb.api.030101.xyz/?type=bestproxy | head -n 5 | awk '{print $0 "#Proxy_" NR}' > ./bestcf/proxy-ip.txt
          
          rm -rf ./tmp*

      - name: Mainland API Identification
        run: python filter.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Git Push to bestcf Branch
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "actions@github.com"
          git checkout -b bestcf
          git add .
          git commit -m "大陆视角更新 ${{ env.update_version }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin bestcf
