name: Generate bestcf (Local Linkage)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main

jobs:
  build:
    # 关键修改：使用自建运行节点
    runs-on: self-hosted 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        # 如果你本地已经装了 Python，这一步可以省略，或者确保路径正确
        run: |
          python3 --version || echo "Please install python3 on your local machine"

      - name: Install dependencies
        run: pip3 install requests

      - name: Generate Raw Assets
        run: |
          # 获取当前时间（本地时间）
          echo "update_version=$(date +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./bestcf/
          
          # 抓取逻辑（与之前一致）
          curl -sSL https://cf.090227.xyz/cmcc?ips=5 | sed 's/#.*//' | awk '{print $0 "#CMCC-IPv4"}' > ./bestcf/cmcc-ip.txt
          curl -sSL https://cf.090227.xyz/cu?ips=5 | sed 's/#.*//' | awk '{print $0 "#CUCC-IPv4"}' > ./bestcf/cucc-ip.txt
          curl -sSL https://cf.090227.xyz/ct?ips=5 | sed 's/#.*//' | awk '{print $0 "#CTCC-IPv4"}' > ./bestcf/ctcc-ip.txt
          curl -sSL https://vps789.com/openApi/cfIpApi | jq -r '.data.AllAvg[].ip' | awk '{print $0 "#CF-IPv4"}' > ./bestcf/bestcf-ip.txt

      - name: Detect Local Routing (Colo)
        # 此时运行此脚本，发出的请求是从你家宽带出去的
        run: python3 geoip_tool.py

      - name: Aggregate All-in-one
        run: |
          cat ./bestcf/cmcc-ip.txt ./bestcf/cucc-ip.txt ./bestcf/ctcc-ip.txt ./bestcf/bestcf-ip.txt > ./bestcf/all-ip.txt

      - name: Push results to GitHub
        run: |
          # 这里使用标准的 git 推送逻辑
          git config --local user.name "Local-Runner"
          git config --local user.email "runner@local.com"
          git add .
          git commit -m "本地联动更新: ${update_version} (基于本地路由)"
          git push origin main
