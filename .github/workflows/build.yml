name: Cloud-Native BestCF
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [ main ]
    paths-ignore: [ "**/README.md", "heartbeat.txt" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests qqwry-py

      - name: Fetch Raw Data
        run: |
          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./bestcf/ ./tmp/
          
          # 1. 抓取域名
          curl -sSL https://cf.090227.xyz | grep 'copyDomain' | awk -F "'" '{print $2}' > ./tmp/raw.txt
          curl -sSL https://vps789.com/openApi/cfIpTop20 | jq -r '.data.good[].ip' | grep -Ev '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' >> ./tmp/raw.txt
          cat ./tmp/raw.txt | grep -E 'cloudflare|cf' | sort -u > ./bestcf/bestcf-domain.txt
          
          # 2. 抓取各运营商 IP
          curl -sSL "https://cf.090227.xyz/cmcc?ips=10" | sed 's/#.*//' | awk '{print $0 "#CMCC-v4_" NR}' > ./bestcf/cmcc-ip.txt
          curl -sSL "https://cf.090227.xyz/cmcc-ipv6" | sed 's/#.*//' | awk '{print $0 "#CMCC-v6_" NR}' >> ./bestcf/cmcc-ip.txt
          curl -sSL "https://cf.090227.xyz/cu?ips=10" | sed 's/#.*//' | awk '{print $0 "#CUCC-v4_" NR}' > ./bestcf/cucc-ip.txt
          curl -sSL "https://cf.090227.xyz/ct?ips=10" | sed 's/#.*//' | awk '{print $0 "#CTCC-v4_" NR}' > ./bestcf/ctcc-ip.txt
          
          # 3. 抓取 Proxy IP (不参与后续地理识别)
          curl -sSL https://ipdb.api.030101.xyz/?type=bestproxy | head -n 5 | awk '{print $0 "#Proxy-v4_" NR}' > ./bestcf/proxy-ip.txt
          rm -rf ./tmp/

      - name: Download QQWry Database
        run: |
          # 下载最新的纯真 IP 数据库
          curl -sSL https://raw.githubusercontent.com/metowolf/qqwry.dat/master/qqwry.dat -o qqwry.dat

      - name: Run Auto-Filter
        run: python filter.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: "Cloudflare 优选 - ${{ env.update_version }}"
          tag: "bestcf"
          overwrite: true
          file_glob: true
          file: ./bestcf/*.txt

      - name: Git Push to bestcf Branch
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "actions@github.com"
          git checkout -b bestcf
          git add .
          git commit -m "Update assets ${{ env.update_version }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin bestcf

      - name: Keepalive
        run: |
          echo "$(date)" > heartbeat.txt
          git config --local user.name "github-actions[bot]"
          git config --local user.email "actions@github.com"
          git add heartbeat.txt
          git commit -m "Keepalive" && git push origin main || true
