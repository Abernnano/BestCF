name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [ main ]
    paths-ignore: [ "**/README.md", "heartbeat.txt" ]

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests

      - name: Generate Data
        shell: bash
        env:
          CURL_OPTS: "-sSLk -4 --tls-max 1.2 --ssl-no-revoke --connect-timeout 20 --retry 5"
        run: |
          echo "update_version=$(date +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./tmp/ ./bestcf/
          
          # 抓取域名
          curl $CURL_OPTS https://cf.090227.xyz | grep 'copyDomain' | awk -F "'" '{print $2}' > ./tmp/raw.txt || true
          curl $CURL_OPTS https://vps789.com/openApi/cfIpTop20 | jq -r '.data.good[].ip' | grep -Ev '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' >> ./tmp/raw.txt || true
          cat ./tmp/raw.txt | grep -E 'cloudflare|cf' | /usr/bin/sort -f -u > ./bestcf/bestcf-domain.txt
          
          # 抓取运营商 IP (注意：移除 awk 里的中括号，统一由 Python 处理)
          curl $CURL_OPTS "https://cf.090227.xyz/cmcc?ips=50" | sed 's/#.*//' | awk '{print $0 "#CMCC-IPv4_" NR}' > ./bestcf/cmcc-ip.txt
          curl $CURL_OPTS "https://cf.090227.xyz/cmcc-ipv6?ips=50" | sed 's/#.*//' | awk '{print $0 "#CMCC-IPv6_" NR}' >> ./bestcf/cmcc-ip.txt
          curl $CURL_OPTS "https://cf.090227.xyz/cu?ips=50" | sed 's/#.*//' | awk '{print $0 "#CUCC-IPv4_" NR}' > ./bestcf/cucc-ip.txt
          curl $CURL_OPTS "https://cf.090227.xyz/ct?ips=50" | sed 's/#.*//' | awk '{print $0 "#CTCC-IPv4_" NR}' > ./bestcf/ctcc-ip.txt
          curl $CURL_OPTS https://vps789.com/openApi/cfIpApi | jq -r '.data.AllAvg[].ip' | awk '{print $0 "#CF-IPv4_Avg_" NR}' > ./bestcf/bestcf-ip.txt
          rm -rf ./tmp*

      - name: Auto-Country Classification
        env:
          PYTHONIOENCODING: utf-8
        run: python filter.py

      - name: Push to Branch
        shell: bash
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b bestcf
          git add .
          git commit -m "优选更新于 ${{ env.update_version }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin bestcf

      - name: Create & Update GitHub Release (Zero-Install Version)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="update-${{ env.update_version }}"
          REPO="${{ github.repository }}"
          
          # 1. 获取或创建 Release ID
          echo "[*] Checking Release..."
          REL_INFO=$(curl -sSLk -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          RELEASE_ID=$(echo "$REL_INFO" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "[*] Creating Release..."
            REL_DATA="{\"tag_name\":\"$TAG\",\"title\":\"优选更新 - ${{ env.update_version }}\",\"body\":\"自动更新于 $(date)\"}"
            RELEASE_ID=$(curl -sSLk -X POST -H "Authorization: token $GITHUB_TOKEN" -d "$REL_DATA" "https://api.github.com/repos/$REPO/releases" | jq -r '.id')
          fi

          # 2. 逐个上传文件 (增加针对透明代理的优化)
          for file in ./bestcf/*.txt; do
            filename=$(basename "$file")
            echo "[*] Uploading $filename..."
            # 使用 -4 强制 IPv4 和 --tls-max 1.2 解决你的路由器握手报错
            curl -sSLk -4 --tls-max 1.2 -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$filename" || echo "::warning::$filename upload failed"
          done

      - name: Purge jsDelivr CDN
        shell: bash
        run: |
          cd ./bestcf/
          /usr/bin/find . -maxdepth 5 -name "*.txt" | sed 's|^\./||' | while read file; do
            curl -sSLk -4 --ssl-no-revoke --connect-timeout 10 "https://purge.jsdelivr.net/gh/${{ github.repository }}@bestcf/${file}" || true
            sleep 1
          done

      - name: Keepalive & Cleanup
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$(date)" > heartbeat.txt
          git add heartbeat.txt
          git commit -m "Keepalive" && git push origin main || echo "Nothing to push"

  # --- 失败重试逻辑 ---
  retry_on_failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
      - name: Wait 20m and Retry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build failed. Retrying in 20 minutes..."
          sleep 1200
          curl -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate_bestcf.yml/dispatches \
            -d '{"ref":"main"}'
