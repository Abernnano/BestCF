name: Generate bestcf (GBK Optimized)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "heartbeat.txt"

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Environment
        shell: powershell
        run: |
          # 切换为 GBK 代码页
          chcp 936
          if (!(Test-Path "./tmp")) { New-Item -ItemType Directory -Path "./tmp" -Force }
          if (!(Test-Path "./bestcf")) { New-Item -ItemType Directory -Path "./bestcf" -Force }
          # 设置更新日期变量
          echo "update_version=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV

      - name: Generate bestcf `Domain`
        shell: powershell
        run: |
          chcp 936
          $domains = New-Object System.Collections.Generic.List[string]
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

          # 抓取 cf.090227.xyz
          try {
              $html = Invoke-RestMethod -Uri "https://cf.090227.xyz" -UserAgent $ua
              if ($html -match "copyDomain\('(.+?)'\)") { $domains.Add($matches[1]) }
              if ($html -match "(?s)<pre>(.*?)</pre>") {
                  $preContent = $matches[1] -split "`n"
                  foreach ($line in $preContent) {
                      $clean = $line.Split('#')[0].Trim()
                      if ($clean) { $domains.Add($clean) }
                  }
              }
          } catch { }

          # 抓取 vps789.com
          try {
              $json = Invoke-RestMethod -Uri "https://vps789.com/openApi/cfIpTop20" -UserAgent $ua
              foreach ($item in $json.data.good) {
                  if ($item.ip -notmatch "^\d+\.\d+\.\d+\.\d+$") { $domains.Add($item.ip) }
              }
          } catch { }

          # 抓取 wetest.vip
          try {
              $wetest = Invoke-WebRequest -Uri "https://www.wetest.vip/page/cloudflare/cname.html" -UserAgent $ua -UseBasicParsing
              $rows = $wetest.Content -split "<tr>"
              foreach ($row in $rows) {
                  if ($row -match "4&6") {
                      if ($row -match "<td>(.*?)</td>") { $domains.Add($matches[1].Replace("*", "bestcf")) }
                  }
              }
          } catch { }

          # 保存为 GBK 编码
          $domains | Where-Object { $_ -match "cloudflare|cf" } | Select-Object -Unique | Out-File -FilePath "./bestcf/bestcf-domain.txt" -Encoding default

      - name: Generate bestcf `IP`
        shell: powershell
        run: |
          chcp 936
          function Get-IPList {
              param($url, $label, $isV6 = $false, $postData = $null)
              $list = New-Object System.Collections.Generic.List[string]
              try {
                  $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                  if ($postData) {
                      $resp = Invoke-RestMethod -Uri $url -Method Post -Body $postData -ContentType "application/json" -UserAgent $ua
                  } else {
                      $resp = Invoke-RestMethod -Uri $url -UserAgent $ua
                  }
                  
                  $ips = @()
                  if ($resp -is [string]) { $ips = $resp -split "[\n,]" } 
                  elseif ($resp.data.CM) { $ips = $resp.data.CM.ip }
                  elseif ($resp.data.CU) { $ips = $resp.data.CU.ip }
                  elseif ($resp.data.CT) { $ips = $resp.data.CT.ip }
                  elseif ($resp.data.AllAvg) { $ips = $resp.data.AllAvg.ip }
                  elseif ($resp.info) { 
                      $ips = $resp.info | Where-Object { $_.line -match $label.Split('-')[0] } | Select-Object -ExpandProperty ip
                  }

                  $count = 1
                  foreach ($ip in $ips) {
                      $cleanIp = $ip.Split('#')[0].Trim().Replace("[","").Replace("]","")
                      if (!$cleanIp) { continue }
                      if ($isV6) { $cleanIp = "[$cleanIp]" }
                      $list.Add("$cleanIp#$($label)_$count")
                      $count++; if ($count -gt 8) { break } 
                  }
              } catch { }
              return $list
          }

          function Get-WeTestIP {
              param($url, $keyword, $label, $isV6 = $false)
              try {
                  $html = (Invoke-WebRequest -Uri $url -UseBasicParsing).Content
                  if ($html -match "$keyword.*?<td>(.*?)</td>") {
                      $ip = $matches[1].Trim()
                      if ($isV6) { $ip = "[$ip]" }
                      return "$ip#$($label)_WeTest_1"
                  }
              } catch {}
          }

          # 移动源 (含 3 号代码全源)
          $cmcc = Get-IPList "https://cf.090227.xyz/cmcc?ips=5" "CMCC-IPv4_CMLiu"
          $cmcc += Get-IPList "https://cf.090227.xyz/cmcc-ipv6" "CMCC-IPv6_CMLiu" $true
          $cmcc += Get-IPList "https://vps789.com/openApi/cfIpApi" "CMCC-IPv4_VPS789"
          $cmcc += Get-IPList "https://api.hostmonit.com/get_optimization_ip" "CMCC-IPv4_CFYes" $false '{"key":"iDetkOys"}'
          $cmcc += Get-IPList "https://api.hostmonit.com/get_optimization_ip" "CMCC-IPv6_CFYes" $true '{"key":"iDetkOys","type":"v6"}'
          $cmcc += Get-WeTestIP "https://www.wetest.vip/page/cloudflare/address_v4.html" "移动" "CMCC-IPv4"
          $cmcc += Get-WeTestIP "https://www.wetest.vip/page/cloudflare/address_v6.html" "移动" "CMCC-IPv6" $true
          $cmcc | Where-Object {$_} | Out-File -FilePath "./bestcf/cmcc-ip.txt" -Encoding default -Force

          # 联通源
          $cucc = Get-IPList "https://cf.090227.xyz/cu?ips=5" "CUCC-IPv4_CMLiu"
          $cucc += Get-IPList "https://vps789.com/openApi/cfIpApi" "CUCC-IPv4_VPS789"
          $cucc += Get-IPList "https://api.hostmonit.com/get_optimization_ip" "CUCC-IPv4_CFYes" $false '{"key":"iDetkOys"}'
          $cucc += Get-WeTestIP "https://www.wetest.vip/page/cloudflare/address_v4.html" "联通" "CUCC-IPv4"
          $cucc | Where-Object {$_} | Out-File -FilePath "./bestcf/cucc-ip.txt" -Encoding default -Force

          # 电信源
          $ctcc = Get-IPList "https://cf.090227.xyz/ct?ips=5" "CTCC-IPv4_CMLiu"
          $ctcc += Get-IPList "https://vps789.com/openApi/cfIpApi" "CTCC-IPv4_VPS789"
          $ctcc += Get-IPList "https://api.hostmonit.com/get_optimization_ip" "CTCC-IPv4_CFYes" $false '{"key":"iDetkOys"}'
          $ctcc += Get-WeTestIP "https://www.wetest.vip/page/cloudflare/address_v4.html" "电信" "CTCC-IPv4"
          $ctcc | Where-Object {$_} | Out-File -FilePath "./bestcf/ctcc-ip.txt" -Encoding default -Force

          # 全球优选
          $best = Get-IPList "https://vps789.com/openApi/cfIpApi" "CF-IPv4_VPS789"
          $best += Get-IPList "https://ip.164746.xyz/ipTop10.html" "CF-IPv4_CFSpeedTest"
          $best += Get-IPList "https://ipdb.api.030101.xyz/?type=bestcfv4" "CF-IPv4_IPDB"
          $best += Get-IPList "https://ipdb.api.030101.xyz/?type=bestcfv6" "CF-IPv6_IPDB" $true
          $best | Where-Object {$_} | Out-File -FilePath "./bestcf/bestcf-ip.txt" -Encoding default -Force

          # 代理源
          $proxy = Get-IPList "https://ipdb.api.030101.xyz/?type=bestproxy" "Proxy-IPv4_IPDB"
          $proxy | Where-Object {$_} | Out-File -FilePath "./bestcf/proxy-ip.txt" -Encoding default -Force

      - name: Auto-Country Classification
        shell: powershell
        run: |
          chcp 936
          if (Test-Path "filter.py") {
              # 如果 Python 脚本报错，尝试在调用前移除 PYTHONIOENCODING 环境变量
              & D:\Anaconda3\python.exe filter.py
          }

      - name: Git push to bestcf branch
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chcp 936
          Set-Location ./bestcf
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.proxy "http://127.0.0.1:7897"
          git checkout -b bestcf
          git add .
          git commit -m "优选更新于 $($env:update_version)"
          git push -f "https://$($env:GITHUB_ACTOR):$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" bestcf

      - name: Create & Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: update-${{ env.update_version }}
          name: 优选更新 - ${{ env.update_version }}
          files: ./bestcf/*.txt
          body: "Cloudflare 优选 IP 自动更新。时间: ${{ env.update_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive (Heartbeat)
        shell: powershell
        run: |
          chcp 936
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          Get-Date | Out-File -FilePath "heartbeat.txt" -Encoding default
          git add heartbeat.txt
          git commit -m "Chore: Keepalive heartbeat $(Get-Date)"
          git push origin main
