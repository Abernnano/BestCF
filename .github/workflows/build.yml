name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "heartbeat.txt"

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests

      - name: Generate Data
        shell: bash
        env:
          # 定义全局通用的强力 CURL 参数，解决 Windows Schannel 报错
          CURL_OPTS: "-sSLk -4 --tls-max 1.2 --ssl-no-revoke --connect-timeout 15 --retry 5"
        run: |
          echo "update_version=$(date +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./tmp/ ./bestcf/
          
          # 1. 抓取域名 (增加容错)
          curl $CURL_OPTS https://cf.090227.xyz | grep 'copyDomain' | awk -F "'" '{print $2}' > ./tmp/temp.txt || true
          curl $CURL_OPTS https://vps789.com/openApi/cfIpTop20 | jq -r '.data.good[].ip' | grep -Ev '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' >> ./tmp/temp.txt || true
          cat ./tmp/temp.txt | grep -E 'cloudflare|cf' | /usr/bin/sort -f -u > ./bestcf/bestcf-domain.txt
          
          # 2. 抓取各运营商 IP (统一去掉 awk 里的中括号，由 Python 处理)
          # CMCC
          curl $CURL_OPTS "https://cf.090227.xyz/cmcc?ips=50" | sed 's/#.*//' | awk '{print $0 "#CMCC-IPv4_" NR}' > ./bestcf/cmcc-ip.txt
          curl $CURL_OPTS "https://cf.090227.xyz/cmcc-ipv6?ips=50" | sed 's/#.*//' | awk '{print $0 "#CMCC-IPv6_" NR}' >> ./bestcf/cmcc-ip.txt
          
          # CUCC
          curl $CURL_OPTS "https://cf.090227.xyz/cu?ips=50" | sed 's/#.*//' | awk '{print $0 "#CUCC-IPv4_" NR}' > ./bestcf/cucc-ip.txt
          
          # CTCC
          curl $CURL_OPTS "https://cf.090227.xyz/ct?ips=50" | sed 's/#.*//' | awk '{print $0 "#CTCC-IPv4_" NR}' > ./bestcf/ctcc-ip.txt
          
          # 其他源 (Hostmonit/VPS789 略, 确保使用 $CURL_OPTS)
          curl $CURL_OPTS https://vps789.com/openApi/cfIpApi | jq -r '.data.AllAvg[].ip' | awk '{print $0 "#CF-IPv4_VPS789_" NR}' >> ./bestcf/bestcf-ip.txt

      - name: Auto-Country Classification
        env:
          PYTHONIOENCODING: utf-8
        run: python filter.py

      - name: Git push & Release
        shell: bash
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b bestcf
          git add .
          git commit -m "优选更新于 ${{ env.update_version }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin bestcf

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: update-${{ env.update_version }}
          files: ./bestcf/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge jsDelivr CDN
        shell: bash
        run: |
          cd ./bestcf/
          /usr/bin/find . -maxdepth 5 -name "*.txt" | sed 's|^\./||' | while read file; do
            # 增加 -4 和 延迟，防止路由器负载过高
            curl -sSLk -4 --ssl-no-revoke --connect-timeout 5 "https://purge.jsdelivr.net/gh/${{ github.repository }}@bestcf/${file}" || true
            sleep 1
          done

      - name: Keepalive
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$(date)" > heartbeat.txt
          git add heartbeat.txt
          git commit -m "Keepalive" && git push origin main || true

  # --- 新增：失败重试逻辑 ---
  retry-on-failure:
    runs-on: ubuntu-latest # 使用 GitHub 托管节点执行重试指令，更稳
    needs: build
    if: failure() # 仅在 build 任务失败时触发
    steps:
      - name: Wait and Retry
        run: |
          echo "检测到任务失败，10分钟后将尝试重新调度..."
          sleep 600
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate_bestcf.yml/dispatches \
            -d '{"ref":"main"}'
