name: Generate bestcf
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [ main ]
    paths-ignore: [ "**/README.md" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 修正版本

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate Data
        run: |
          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> ${GITHUB_ENV}
          mkdir -p ./bestcf/
          # 此处保留你原有的所有 curl 抓取逻辑...
          # (为节省篇幅略过，请确保包含你的 cmcc/cucc/ctcc 抓取代码)

      - name: Run Filter
        run: python filter.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Push assets
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "actions@github.com"
          git checkout -b bestcf
          git add .
          git commit -m "Update BestCF ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin bestcf
